# ALICE M2 카메라 세트 — 프레임·토픽·장치·장착 위치를 바꾸는 곳은 여기 하나.
#
# 읽는 곳: rtabmap_launch alice_m2/m2_camera.launch.py (매니저 camera_m2)
#          rtabmap_launch alice_m2/m2_rtabmap.launch.py (lifelong_mapping_m2, 벤치 단독 실행)
#          aeirobot_lifelong alice_m2/m2_lifelong.launch.py (lifelong_m2)
#          aeirobot_slam_manager 헬스 모니터 (camera_m2 가 볼 camera_info 목록)
# 로봇: ~/.aeirobot/config/rtabmap/alice_m2/m2_cameras.yaml 을 고치고 웹에서 camera_m2·SLAM 프로세스만 재시작 (이미지 재빌드 없음).
#       단 카메라 이름·대수를 바꾸면 매니저도 재시작 — 헬스 감시(camera_info 목록)는 매니저 기동 때만 읽는다.
# 다른 파일을 쓰려면: env AEIROBOT_M2_CAMERAS=<경로> (노트북 벤치 serial 사본 등). 매니저·헬스 감시는 이 env 만 따른다 —
#   런치 인자 m2_config:=<경로> 는 그 런치 하나에만 들어가므로 CLI 단독 실행용.
# 배포본에 새 키가 생겨도 고친 호스트 파일엔 안 들어간다(.new 로 옆에 놓인다) — 빠진 키는 아래 주석의 기본값.
m2_cameras:
  base_frame: base_footprint        # 로봇 기준 프레임 — rtabmap frame_id, Khronos robot_frame, lc_bridge base_frame, 장착 TF 기본 부모
  odom_topic: ''                    # '' = cameras[0] VO(rgbd_odometry 가 odom→base_frame TF 발행). M2 베이스 odom 이 생기면 그 토픽 — VO 가 꺼진다
  rgbd_images_topic: /m2/rgbd_images  # 카메라 묶음(rgbdx_sync) 출력 = rtabmap 입력. '' = cameras[0] 한 대만 (A/B 비교)
  sync_max_interval: 0.05           # 카메라끼리 짝짓는 시간 상한 [s]. HW 동기 없음 15fps 면 0.05, PTP/동기 케이블이면 0.005

  mount_tf:
    publish: true                   # 임시 장착 TF (parent → <name>_link). 외부 TF 노드가 camera_0N_link 를 내기 시작하면 false
                                    # — 둘 다 내면 <name>_link 의 부모가 둘이 된다

  cameras:                          # 순서 = 묶음 순서. [0] 이 주 카메라 (VO·Khronos·시멘틱·특징 지속성)
    - name: camera_01               # 토픽 /camera_01/{color,depth}/…, 프레임 camera_01_link·camera_01_color_optical_frame
      device: 192.168.1.10          # IP = PoE(335Le, 포트 8090). 그 밖 = USB serial(336L). 머리/몸통 대응은 미정 — 순서만 바꾸면 된다
      parent: base_footprint        # 장착 TF 부모 (생략 = base_frame). 다른 카메라의 <name>_link 도 된다
      xyz: [0.0, 0.0, 0.0]          # [m]  — 임시값. 기구팀 확정 전
      rpy: [0.0, 0.0, 0.0]          # [rad] URDF 규약 R = Rz·Ry·Rx (alice_parameters sensor_extrinsics.yaml 과 같다)
    - name: camera_02
      device: 192.168.1.11
      parent: camera_01_link        # 노트북 벤치 값: camera_01 바로 아래 3 cm
      xyz: [0.0, 0.0, -0.03]
      rpy: [0.0, 0.0, 0.0]

  driver:                           # gemini_330_series 인자 덮어쓰기 — 모든 카메라 공통 (rtabmap 은 카메라 크기가 같아야 한다)
    align_mode: HW                  # 칩 D2C. 펌웨어가 못 하면(336L FW 1.2.81 실측 "not support hardware d2c") SW
