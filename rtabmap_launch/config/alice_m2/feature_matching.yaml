# 특징 추출 · 매칭 설정 (rtabmap) — SLAM 을 시작할 때 aeirobot_rtabmap.launch.py 가 읽는다
#
# 이 파일로 하는 일은 둘이다. 어느 쪽이든 저장한 뒤 SLAM 프로세스를 다시 시작해야 적용된다.
#   ① 묶음 고르기 — 바로 아래 use 한 줄을 고친다 (추출기와 매칭기가 통째로 바뀐다)
#   ② 값 조정하기 — 그 아래 sets 에서 use 로 고른 묶음의 값을 고친다 (고르지 않은 묶음의 값은 쓰이지 않는다)
# 지금 무엇이 돌고 있는지는 이 파일이 아니라 SLAM 시작 로그의 「[aeirobot_rtabmap] 특징 묶음 <이름> … 적용 값 …」 줄로 확인한다.

# ① 쓸 묶음 — 설정이다 (상태를 보여 주는 칸이 아니다). 이 줄을 고쳐야 바뀐다. 고를 수 있는 이름은 아래 sets 에 있는 이름이다.
#   ⚠ 묶음을 바꾸면 맵을 다시 만든다. 디스크립터가 달라(256 ↔ 128차원) 다른 묶음으로 만든 맵은 못 쓴다.
#     옛 맵으로 위치추정을 띄우면 launch 가 이유를 적고 멈춘다. 이 줄을 되돌리면 그 맵은 다시 쓸 수 있다.
use: superpoint_superglue          # superpoint_superglue (SuperPoint + SuperGlue) 또는 aliked_lightglue (ALIKED + LightGlue)

# ② 묶음별 값 — 아래 sets 에서 use 로 고른 묶음만 쓰인다
#
# ■ 값 조정하기 — 한 번에 값 하나만 바꾸고, SLAM 을 다시 시작해 로그로 확인한다
#   값마다 올리면 · 내리면 어떻게 되는지는 그 값 바로 위에 적혀 있다. 증상에서 시작하려면:
#     맵이 휘거나 겹친다 · 위치가 순간이동한다  = 틀린 루프가 통과했다
#         → RGBD/OptimizeMaxError 를 내린다. 그래도 남으면 Vis/MinInliers 를 올린다
#     맵이 안 닫힌다 · 위치를 잘 못 찾는다      = 맞는 루프가 버려졌다
#         → Vis/MinInliers 를 내린다. 다음은 RGBD/OptimizeMaxError 를 올린다. 다음은 Kp/MaxFeatures · Vis/MaxFeatures 를 올린다
#     무늬 없는 벽 앞에서만 못 찾는다           = 그 장면에서 특징점이 모자란다
#         → Kp/MaxFeatures · Vis/MaxFeatures 를 올린다 (SuperPoint 묶음은 SuperPoint/Threshold 를 내리는 것도)
#     넓은 곳에서만 못 찾는다                   = 벽이 멀어 특징점이 거리 제한에 걸린다
#         → rtabmap_params.yaml 의 Kp/MaxDepth 를 본다
#     느리다 · GPU 가 모자란다
#         → rtabmap_params.yaml 의 Rtabmap/DetectionRate 를 내린다. 다음은 Kp/MaxFeatures · Vis/MaxFeatures 를 내린다
#
# ■ 고친 뒤 SLAM 로그에서 볼 것
#   [aeirobot_rtabmap] 특징 묶음 … 적용 값 …
#       실제로 적용된 값이다 (launch 가 덮은 것까지 반영). 고친 값이 여기 나오는지 먼저 본다.
#   Rejected loop closure 74 -> 89: Not enough inliers 43/50 (matches=303) …
#       인라이어 43개가 문턱(Vis/MinInliers) 50 에 못 미쳐 버린 루프다. 43/50 처럼 문턱 바로 아래가 잦으면 그 수까지 내리면 붙는다.
#       3/50 처럼 한참 모자라면 두 자리가 원래 다른 곳이다. 문턱을 내려도 달라지지 않는다.
#   Rejecting all added loop closures … maximum graph error ratio of 1.97 … "RGBD/OptimizeMaxError" is 1.5 …
#       오차비 1.97 이 문턱 1.5 를 넘어 버린 루프다 (위치추정 중에는 Rejecting localization … 으로 나온다).
#       맞는 자리인데 문턱을 조금 넘는 값이 잦으면 그 값 위로 올린다. 홀로 튀는 틀린 루프는 대개 훨씬 크다
#       (옛 시뮬 무대에서 0.9 ~ 6 m 틀린 루프가 2.3 ~ 2.9, 심한 것은 수십 이상).
#       같은 무늬가 이어진 곳의 틀린 루프 묶음은 서로 맞아떨어져 오차비가 작게 나온다 (0.5). 이 문턱으로는 못 거른다.
#
# ■ 값 견주기
#   원래 묶음을 고치지 말고 통째로 복사해 새 이름을 붙인 뒤 (Kp/DetectorStrategy 는 그대로) 그 사본의 값을 고치고 use 에 그 이름을 적는다.
#   Kp/DetectorStrategy 가 같으면 맵은 그대로 쓰므로 use 한 줄로 오가며 견줄 수 있다.
#
# 여기 있는 키는 이 파일만 정한다. rtabmap_params.yaml 에 같은 키를 다른 값으로 적어 두면 launch 가 멈추고 옮기라고 알린다
# (옛 기본값이 그대로 남은 줄은 안 쓰이고 지나간다). 값은 launch 가 문자열로 바꿔 넘기므로 따옴표는 없어도 된다.
# 잰 값 · 시험법 · 멈춤 메시지별 조치는 config/README.md.
sets:
  # SuperPoint + SuperGlue — 지금까지 쓰던 것. MagicLeap 비상업 · 연구용 라이선스라 고객 배포본에는 못 싣는다.
  # 카메라 2대(M2)에서는 SuperGlue 가 안 돌아 BF 교차검사로 매칭한다 (launch 가 Vis/CorNNType 을 5 로 바꾼다).
  superpoint_superglue:
    Kp/DetectorStrategy: 11        # 묶음의 정체 (11 = SuperPoint). 고치지 않는다

    # ── 추출 ──
    # 영상 한 장에서 쓰는 특징점 수 — Kp 는 장소 인식, Vis 는 두 영상의 정합. 두 값은 같이 움직인다 (rtabmap 기본 500 · 1000)
    #   올리면: 대응점이 늘어 무늬 적은 곳 · 먼 곳에서도 루프가 붙는다. 추출 · 매칭 시간과 맵 DB 크기가 같이 는다
    #   내리면: 빨라지고 맵이 작아진다. 인라이어가 줄어 Vis/MinInliers 문턱에 걸려 버려지는 루프가 는다
    #   잰 값: 1000 뿐이다. 움직여 본다면 500 ~ 2000
    Kp/MaxFeatures: 1000
    Vis/MaxFeatures: 1000
    # SuperPoint 검출 임계 — 이 점수보다 약한 점은 버린다 (rtabmap 기본 0.010)
    #   내리면: 약한 점까지 뽑아 무늬 적은 곳에서 점이 는다 (상한은 Kp/MaxFeatures). 잡음 같은 점도 섞인다
    #   올리면: 강한 모서리만 남는다. 밋밋한 장면에서는 점이 모자라 루프가 안 붙는다
    SuperPoint/Threshold: 0.005
    # 특징점 사이 최소 간격 [px]. 올리면 점이 영상 전체에 고르게 퍼지고, 내리면 무늬 많은 곳에 몰린다
    SuperPoint/NMSRadius: 4

    # ── 매칭 ── M2 는 위 까닭으로 아래 세 값을 고쳐도 달라지지 않는다 (시작 로그에 Vis/CorNNType=5 로 나온다)
    # 매칭기: 6 = 학습 매칭기 (SuperGlue), 5 = BF 교차검사, 1 = kNN + 비율 검사
    #   6: 보는 방향이 많이 달라도 붙인다. 루프가 늘고, 수락 문턱이 느슨하면 틀린 루프도 같이 는다. GPU 를 쓴다
    #   5: 주로 비슷한 방향에서 본 장면끼리 붙는다. 루프가 줄고 가볍다
    Vis/CorNNType: 6
    # SuperGlue 매칭 신뢰도 임계 — 이보다 자신 없는 대응점은 버린다
    #   올리면: 대응점이 줄어 인라이어가 줄고 루프가 준다
    #   내리면: 대응점이 늘고 의심스러운 것도 섞인다 (정합 단계가 한 번 더 거른다)
    PyMatcher/Threshold: 0.2
    # SuperGlue Sinkhorn 반복 수. 올리면 짝짓기가 조금 정밀해지고 그만큼 느려진다 (rtabmap 기본 20)
    PyMatcher/Iterations: 40

    # ── 루프 수락 ── 틀린 루프(다른 자리를 같은 자리로 잇는 것)를 거르는 문턱
    # 두 영상을 정합했을 때 기하까지 맞아떨어진 대응점(인라이어)이 이보다 적으면 그 루프를 버린다 (rtabmap 기본 20)
    #   올리면: 틀린 루프가 준다. 맞는 루프도 버려져 맵이 덜 닫히고 위치를 덜 자주 찾는다
    #   내리면: 위치를 더 자주 찾는다. 틀린 루프가 통과하기 쉬워진다
    #   잰 값: 30 · 50. 얼마로 할지는 로그 "Not enough inliers 43/50" 의 앞 숫자를 보고 정한다 (맨 위 「로그」)
    Vis/MinInliers: 30
    # 루프를 넣고 그래프를 최적화했을 때 링크가 제 오차 범위(표준편차)의 몇 배나 어긋나는가 = 오차비. 이 값을 넘으면 버린다 (rtabmap 기본 3.0)
    #   내리면: 주변 주행 기록과 안 맞는 루프를 더 엄격히 거른다. 오도메트리가 많이 흐른 뒤에는 맞는 루프도 버려진다
    #   올리면: 루프가 더 잘 붙는다. 틀린 루프가 통과해 맵이 휘거나 위치가 튄다
    #   잰 값: 1.5 · 3.0. 0 은 검사를 끄므로 쓰지 않는다. 이 기기 기본은 1.5 (카메라 2대, 2026-10-16 결정)
    RGBD/OptimizeMaxError: 1.5
    mapping:                       # 맵을 만들 때만 덧씌우는 값 (위치추정에만 쓸 값은 localization: 아래에 같은 모양으로)
      Vis/MinInliers: 50           # 맵에 들어간 틀린 루프는 계속 맵을 끌어당긴다. 그래서 맵을 만들 때는 더 엄격하게

  # ALIKED + LightGlue — 바꿔 갈 것 (BSD-3 · Apache-2.0). 카메라 2대도 LightGlue 로 매칭한다.
  aliked_lightglue:
    Kp/DetectorStrategy: 15        # 묶음의 정체 (15 = ALIKED). 고치지 않는다

    # ── 추출 ──
    # 영상 한 장에서 쓰는 특징점 수 — Kp 는 장소 인식, Vis 는 두 영상의 정합. 두 값은 같이 움직인다 (rtabmap 기본 500 · 1000)
    #   올리면: 대응점이 늘어 무늬 적은 곳 · 먼 곳에서도 루프가 붙는다. 추출 · 매칭 시간과 맵 DB 크기가 같이 는다
    #   내리면: 빨라지고 맵이 작아진다. 인라이어가 줄어 Vis/MinInliers 문턱에 걸려 버려지는 루프가 는다
    #   잰 값: 1000 뿐이다. 움직여 본다면 500 ~ 2000. ALIKED 는 후보를 4096개까지 내고 rtabmap 이 점수순으로 이 수만큼 남긴다
    Kp/MaxFeatures: 1000
    Vis/MaxFeatures: 1000

    # ── 매칭 ──
    # 매칭기: 6 = 학습 매칭기 (LightGlue), 5 = BF 교차검사, 1 = kNN + 비율 검사
    #   6: 보는 방향이 많이 달라도 붙인다. 루프가 늘고, 수락 문턱이 느슨하면 틀린 루프도 같이 는다. GPU 를 쓴다
    #   5: 주로 비슷한 방향에서 본 장면끼리 붙는다. 루프가 줄고 가볍다. ALIKED + BF 는 잰 적이 없다
    Vis/CorNNType: 6
    # LightGlue 매칭 신뢰도 임계 — 이보다 자신 없는 대응점은 버린다
    #   올리면: 대응점이 줄어 루프가 준다. 0.3 으로 재 보고 버렸다 — 카메라 1대 오차 0.9 → 2.2 cm,
    #           벽면이 바뀐 장면에서 위치를 찾은 프레임 36 → 28 (카메라 2대) · 29 → 15 (1대)
    #   내리면: 대응점이 늘고 의심스러운 것도 섞인다 (정합 단계가 한 번 더 거른다). 0.1 아래는 잰 적이 없다
    PyMatcher/Threshold: 0.1

    # ── 루프 수락 ── 틀린 루프(다른 자리를 같은 자리로 잇는 것)를 거르는 문턱
    # 두 영상을 정합했을 때 기하까지 맞아떨어진 대응점(인라이어)이 이보다 적으면 그 루프를 버린다 (rtabmap 기본 20)
    #   올리면: 틀린 루프가 준다. 맞는 루프도 버려져 맵이 덜 닫히고 위치를 덜 자주 찾는다
    #   내리면: 위치를 더 자주 찾는다. 틀린 루프가 통과하기 쉬워진다
    #   잰 값: 30 · 50. 얼마로 할지는 로그 "Not enough inliers 43/50" 의 앞 숫자를 보고 정한다 (맨 위 「로그」)
    Vis/MinInliers: 30
    # 루프를 넣고 그래프를 최적화했을 때 링크가 제 오차 범위(표준편차)의 몇 배나 어긋나는가 = 오차비. 이 값을 넘으면 버린다 (rtabmap 기본 3.0)
    #   내리면: 주변 주행 기록과 안 맞는 루프를 더 엄격히 거른다. 오도메트리가 많이 흐른 뒤에는 맞는 루프도 버려진다
    #   올리면: 루프가 더 잘 붙는다. 틀린 루프가 통과해 맵이 휘거나 위치가 튄다
    #   잰 값: 1.5 · 3.0. 0 은 검사를 끄므로 쓰지 않는다
    #   이 묶음은 1.5 를 넘기지 않는다. 카메라 2대에서 3.0 이면 방향이 90° 쯤 다른 자리를 잇는 7 ~ 12 cm 틀린 루프가 통과해
    #   맵이 휜다 (2026-11-17 Isaac 정답 비교: 오차 중앙값 0.7 → 1.4 cm)
    RGBD/OptimizeMaxError: 1.5
    mapping:                       # 맵을 만들 때만 덧씌우는 값 (위치추정에만 쓸 값은 localization: 아래에 같은 모양으로)
      Vis/MinInliers: 50           # 맵에 들어간 틀린 루프는 계속 맵을 끌어당긴다. 그래서 맵을 만들 때는 더 엄격하게
